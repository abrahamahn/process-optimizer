name: Native Windows build and recovery tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Archive committed source without local state
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output=dist/process-optimizer-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ github.sha }}
          path: dist/process-optimizer-source.tar.gz
          retention-days: 14
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
      - run: cargo fmt --all -- --check
      - name: Prepare disposable current-user startup fixture parent
        shell: pwsh
        run: New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Force | Out-Null
      - name: Native and behavioral tests (only test-owned fixtures may be changed)
        run: cargo test --locked --all-targets -- --nocapture
      - name: Separately opt in to force termination of our disposable fixture only
        run: cargo test --locked --test windows_contract -- --ignored --nocapture
      - name: Complete session lifecycle as a disposable standard user
        shell: pwsh
        run: ./scripts/ci-normal-user.ps1
      - name: Native static checks
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build portable application
        run: cargo build --locked --release --bin process-optimizer
      - name: Verify portable runtime dependencies
        shell: pwsh
        run: ./scripts/check-portable.ps1
      - name: Native window creation and read-only GPU probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = (Resolve-Path target/release/process-optimizer.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--ui-smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Native UI smoke test failed' }
          $probe = Join-Path $pwd 'dist/ci.probe.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--probe', $probe) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Read-only GPU probe failed' }
          $data = Get-Content $probe -Raw | ConvertFrom-Json
          Write-Host "Probe parsed. Record count: $($data.processes.Count). No machine inventory is published."
          Write-Host "GPU provider status: $($data.gpu_status)"
          Remove-Item $probe
      - name: Package portable executable with commit identity and checksums
        shell: pwsh
        run: |
          Copy-Item target/release/process-optimizer.exe dist/
          Copy-Item README.md dist/
          Set-Content -Path dist/SOURCE-COMMIT.txt -Value '${{ github.sha }}' -Encoding utf8
          $exeHash = (Get-FileHash dist/process-optimizer.exe -Algorithm SHA256).Hash
          "$exeHash  process-optimizer.exe" | Set-Content dist/EXE-SHA256.txt
          Compress-Archive -Path dist/process-optimizer.exe,dist/README.md,dist/SOURCE-COMMIT.txt,dist/EXE-SHA256.txt -DestinationPath dist/process-optimizer-windows-x64.zip
          $hash = (Get-FileHash dist/process-optimizer-windows-x64.zip -Algorithm SHA256).Hash
          "$hash  process-optimizer-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: process-optimizer-windows-x64-${{ github.sha }}
          path: |
            dist/process-optimizer-windows-x64.zip
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
