name: Refine v0.4 app controls
on:
  push:
    branches: [codex/cleanup-ui-v04]
    paths: [.github/workflows/refine-controls-v04.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply reviewed control refinement
        run: python scripts/refine_controls_v04.py
      - name: Normalize Win32 owner-draw ABI and final source shape
        shell: pwsh
        run: |
          $py = @'
          from pathlib import Path
          import re

          p = Path('src/windows/simple_ui.rs')
          text = p.read_text(encoding='utf-8')
          marker = 'const ES_READONLY_STYLE: u32 = 0x0800;\n'
          abi = '''const ES_READONLY_STYLE: u32 = 0x0800;\n#[repr(C)]\nstruct AppDrawItem {\n    _ctl_type: u32,\n    ctl_id: u32,\n    item_id: u32,\n    _item_action: u32,\n    item_state: u32,\n    _hwnd_item: HWND,\n    hdc: HDC,\n    rc_item: RECT,\n    _item_data: usize,\n}\n'''
          if marker not in text:
              raise RuntimeError('owner-draw ABI insertion marker missing')
          text = text.replace(marker, abi, 1)
          replacements = {
              'BST_CHECKED as usize': '1usize',
              'BST_UNCHECKED as usize': '0usize',
              'DRAWITEMSTRUCT': 'AppDrawItem',
              'item.CtlID': 'item.ctl_id',
              'item.itemID': 'item.item_id',
              'item.itemState': 'item.item_state',
              'item.hDC': 'item.hdc',
              'item.rcItem': 'item.rc_item',
              'ODS_SELECTED as u32': '0x0001u32',
              'ODS_FOCUS as u32': '0x0010u32',
              '(DT_SINGLELINE | DT_VCENTER | DT_NOPREFIX | DT_END_ELLIPSIS) as u32': 'DT_SINGLELINE | DT_VCENTER | DT_NOPREFIX | DT_END_ELLIPSIS',
              '.sort_by_key(|c| (!c.essential, c.name.to_lowercase()));': '.sort_by_key(|c| ((c.protected || c.essential), c.essential, c.name.to_lowercase()));',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f'expected final-shape token missing: {old}')
              text = text.replace(old, new)

          match = re.search(
              r'(?s)(#\[cfg\(test\)\]\nmod recommendation_tests \{.*?\n\}\n\n)(pub fn run\(\) -> AppResult<\(\)> \{)',
              text,
          )
          if not match:
              raise RuntimeError('recommendation test module placement marker missing')
          block = match.group(1)
          text = text[:match.start(1)] + text[match.end(1):]
          text = text.rstrip() + '\n\n' + block
          p.write_text(text, encoding='utf-8', newline='\n')
          '@
          $py | python -
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Prepare disposable current-user startup fixture parent
        shell: pwsh
        run: New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Force | Out-Null
      - name: Format and test refined source
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked --all-targets -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo test --locked --test windows_contract -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Force fixture failed' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo build --locked --release --bin process-optimizer
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          ./scripts/check-portable.ps1
      - name: Standard-user lifecycle fixtures
        shell: pwsh
        run: ./scripts/ci-normal-user.ps1
      - name: Native UI smoke and read-only probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force review | Out-Null
          $exe = (Resolve-Path target/release/process-optimizer.exe).Path
          foreach ($mode in @('--ui-smoke','--advanced-smoke')) {
            $p = Start-Process -FilePath $exe -ArgumentList $mode -PassThru
            if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "$mode timed out" }
            if ($p.ExitCode -ne 0) { throw "$mode failed" }
          }
          $probe = Join-Path $pwd 'review/ci.probe.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--probe',$probe) -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Probe timed out' }
          if ($p.ExitCode -ne 0) { throw 'Probe failed' }
          Remove-Item $probe
      - name: Commit only refined product source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/windows/simple_ui.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'feat: add explicit keep states and process recommendations'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:refs/heads/codex/cleanup-ui-v04
            if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Cannot inspect staged changes' }
          git rev-parse HEAD
