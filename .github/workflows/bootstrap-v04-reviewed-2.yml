# bootstrap reviewed v0.4 source into branch; normal CI performs verification
name: Bootstrap reviewed v0.4 source (verified)
on:
  push:
    branches: [codex/cleanup-ui-v04]
    paths: [.github/workflows/bootstrap-v04-reviewed-2.yml]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore and normalize reviewed implementation source
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-WebRequest -Uri "https://api.github.com/repos/abrahamahn/process-optimizer/actions/artifacts/10112844022/zip" -Headers $headers -OutFile bootstrap.zip
          Expand-Archive bootstrap.zip bootstrap -Force
          $nested = Get-ChildItem bootstrap -Recurse -Filter 'v04-source.zip' | Select-Object -First 1
          if (-not $nested) { throw 'Reviewed v0.4 source archive missing' }
          Expand-Archive $nested.FullName reviewed -Force
          foreach ($dir in @('src','tests')) {
            if (-not (Test-Path (Join-Path reviewed $dir))) { throw "Missing reviewed $dir" }
            Remove-Item $dir -Recurse -Force
            Copy-Item (Join-Path reviewed $dir) $dir -Recurse
          }
          Copy-Item reviewed/Cargo.toml Cargo.toml -Force
          $py = @'
          from pathlib import Path
          import re

          ui = Path('src/windows/simple_ui.rs')
          text = ui.read_text(encoding='utf-8')
          doc = '//! Small native front door: On/Off first, app permissions behind Settings.'
          imp = 'use windows_sys::Win32::UI::Input::KeyboardAndMouse::SetFocus;'
          if imp not in text:
              if doc not in text:
                  raise RuntimeError('Reviewed module header changed unexpectedly')
              text = text.replace(doc, doc + '\n' + imp, 1)
          ui.write_text(text, encoding='utf-8', newline='\n')

          for file, expected in [('tests/manual_mode.rs', 1), ('tests/worker_e2e.rs', 2)]:
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(r'(?m)^(\s*)schema: 1,\s*$', r'\1schema: 1,\n\1startup_disabled: vec![],', text)
              if count != expected:
                  raise RuntimeError(f'{file}: expected {expected} Config schema initializer(s), got {count}')
              p.write_text(text, encoding='utf-8', newline='\n')

          if 'const PERMANENT:' not in ui.read_text(encoding='utf-8'):
              raise RuntimeError('Permanent cleanup UI source not present')
          if not Path('src/windows/startup.rs').exists():
              raise RuntimeError('Startup adapter missing')
          '@
          $py | python -
      - name: Install pinned Rust formatting toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Resolve and format source
        shell: pwsh
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Lockfile failed' }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'Format failed' }
      - name: Commit normalized source for normal CI
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock src tests
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'feat: stage two-mode cleanup and copyable process diagnostics'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:refs/heads/codex/cleanup-ui-v04
            if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Cannot inspect staged changes' }
          git rev-parse HEAD
