name: Polish v0.4 app controls
on:
  push:
    branches: [codex/cleanup-ui-v04]
    paths: [.github/workflows/polish-controls-v04.yml]
permissions:
  contents: write
jobs:
  polish:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply final UX polish
        run: python scripts/polish_controls_v04.py
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Prepare disposable current-user startup fixture parent
        shell: pwsh
        run: New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Force | Out-Null
      - name: Full Windows validation
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo test --locked --all-targets -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo test --locked --test windows_contract -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Force fixture failed' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo build --locked --release --bin process-optimizer
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          ./scripts/check-portable.ps1
      - name: Standard-user lifecycle fixtures
        shell: pwsh
        run: ./scripts/ci-normal-user.ps1
      - name: Native UI smoke and read-only probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force review | Out-Null
          $exe = (Resolve-Path target/release/process-optimizer.exe).Path
          foreach ($mode in @('--ui-smoke','--advanced-smoke')) {
            $p = Start-Process -FilePath $exe -ArgumentList $mode -PassThru
            if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "$mode timed out" }
            if ($p.ExitCode -ne 0) { throw "$mode failed" }
          }
          $probe = Join-Path $pwd 'review/ci.probe.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--probe',$probe) -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Probe timed out' }
          if ($p.ExitCode -ne 0) { throw 'Probe failed' }
          Remove-Item $probe
      - name: Commit only polished product source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/windows/simple_ui.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'fix: preserve app selection and selector state'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:refs/heads/codex/cleanup-ui-v04
            if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
          } elseif ($LASTEXITCODE -ne 0) { throw 'Cannot inspect staged changes' }
          git rev-parse HEAD
