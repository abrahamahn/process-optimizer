name: Validate application workflows
on:
  push:
    branches: [codex/application-workflows]
    paths: [scripts/product-part-*.txt, scripts/prepare_product.py, scripts/product_followup.py, .github/workflows/prepare-product.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'abrahamahn/process-optimizer' && github.ref == 'refs/heads/codex/application-workflows'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply checksum-verified reviewed product changes
        run: python scripts/prepare_product.py
      - name: Install pinned native toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Format source
        run: cargo fmt --all
      - name: Native and deterministic behavior tests
        run: cargo test --locked --all-targets -- --nocapture
      - name: Separately opt in to force termination of our own fixture
        run: cargo test --locked --test windows_contract -- --ignored --nocapture
      - name: Production worker lifecycle and GUI reopen under a disposable standard account
        shell: pwsh
        run: ./scripts/ci-normal-user.ps1
      - name: Warning-free static checks
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build portable application
        run: cargo build --locked --release --bin process-optimizer
      - name: Verify portable runtime dependencies
        shell: pwsh
        run: ./scripts/check-portable.ps1
      - name: Native window and read-only collector smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = (Resolve-Path target/release/process-optimizer.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--ui-smoke' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Our UI smoke timed out' }
          if ($p.ExitCode -ne 0) { throw 'Native UI smoke failed' }
          $probe = Join-Path $pwd 'dist/ci.probe.json'
          $p = Start-Process -FilePath $exe -ArgumentList @('--probe', $probe) -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Our read-only probe timed out' }
          if ($p.ExitCode -ne 0) { throw 'GPU probe failed' }
          $data = Get-Content $probe -Raw | ConvertFrom-Json
          Write-Host "GPU provider status: $($data.gpu_status)"
          Remove-Item $probe
      - name: Commit verified source to this validation branch only
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests specs Cargo.toml Cargo.lock README.md
          git commit -m 'feat: add reviewed application grouping, game profiles and crash-safe GUI reopening'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit verified source' }
          git push origin HEAD:refs/heads/codex/application-workflows
          if ($LASTEXITCODE -ne 0) { throw 'Branch advanced; refusing overwrite' }
          git rev-parse HEAD
      - name: Archive reviewed source only
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force review | Out-Null
          Compress-Archive -Path src,tests,specs,Cargo.toml,Cargo.lock,README.md,AGENTS.md,rust-toolchain.toml -DestinationPath review/application-workflows-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: application-workflows-review
          path: review/application-workflows-source.zip
          retention-days: 7
